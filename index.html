<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Technologies Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-4" style="max-width: 820px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <button id="themeToggle" class="btn btn-link fs-2 p-0 text-decoration-none" aria-label="Toggle dark/light mode">☀️</button>
      <span class="fw-semibold text-body-secondary">CSC336 Web Technologies Quiz</span>
    </div>

    <!-- Multi-colored segmented progress bar -->
    <div id="segBar" class="seg-bar mb-3" aria-label="Quiz progress"></div>

    <!-- Quiz card -->
    <section id="quizCard" class="card shadow-sm">
      <div class="card-body p-3 p-md-4">
        <div class="d-flex justify-content-between flex-wrap gap-2 mb-2">
          <span id="qCounter" class="fs-5">Question 1 / 5</span>
          <span id="timer" class="fw-bold fs-5 text-success">Time Left: 15s</span>
        </div>
        <h2 id="qText" class="h3 fw-bold mb-4"></h2>
        <div id="options" class="d-grid gap-3 mb-4"></div>
        <div class="text-center">
          <button id="nextBtn" class="btn btn-success btn-lg px-4" disabled>Next →</button>
        </div>
      </div>
    </section>

    <!-- Result card -->
    <section id="resultCard" class="card shadow-sm d-none">
      <div class="card-body p-3 p-md-4">
        <h2 class="h3 fw-bold">Quiz Result</h2>
        <p id="scoreText" class="fs-5"></p>
        <div class="table-responsive">
          <table class="table table-bordered align-middle">
            <thead><tr><th>#</th><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Status</th></tr></thead>
            <tbody id="resultBody"></tbody>
          </table>
        </div>
        <div class="d-flex flex-wrap gap-2 justify-content-center">
          <button id="pdfBtn" class="btn btn-primary">⬇ Download PDF</button>
          <button id="restartBtn" class="btn btn-outline-secondary">↻ Restart Quiz</button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
